[profile.default]
src = "src"
out = "out"
libs = ["lib", "node_modules"]
solc_version = "0.8.24"
evm_version = "cancun"
# CreditCore v4 (tiered registry + parsers) exceeds the 24576 B runtime limit
# without the optimizer (forge default is off); 200 runs brings it well under.
optimizer = true
optimizer_runs = 200
remappings = [
    "@openzeppelin/contracts/=node_modules/@openzeppelin/contracts/",
    "@gluwa/usc-contracts/=node_modules/@gluwa/usc-contracts/",
]
# Деплой-скрипты пишут адреса в docs/deployments.json (репо-корень)
fs_permissions = [{ access = "read-write", path = "../docs" }]

[rpc_endpoints]
cc3 = "https://rpc.cc3-testnet.creditcoin.network"
sepolia = "${SEPOLIA_RPC}"

# Chain IDs:
#   cc3     = 102031 (Creditcoin CC3 Testnet)
#   sepolia = 11155111 (Ethereum Sepolia)
